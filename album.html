<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Album — Mohammad Ishmam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="index.html">Mohammad Ishmam</a>
    <a class="header-link" href="index.html">All albums</a>
  </header>

  <main>
    <section class="album-header">
      <a class="back-link" href="index.html">&larr; Photography</a>
      <h1 id="album-title">Album</h1>
    </section>

    <section class="photo-stack" id="photo-stack" aria-label="Photos in this album">
      <!-- Photos injected by js/album.js -->
    </section>
  </main>

  <footer class="site-footer">
    <span>&copy; <span id="year"></span> Mohammad Ishmam</span>
    <a href="#top" class="to-top">Back to top</a>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&#8249;</button>
    <img class="lightbox-image" id="lightbox-image" src="" alt="">
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">&#8250;</button>
  </div>

  <script src="js/album.js"></script>
</body>
</html>
